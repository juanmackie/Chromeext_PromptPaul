<!DOCTYPE html>
<html>
<head>
    <title>Theme Test</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="chat.css">
    <style>
        body {
            padding: 20px;
            font-family: var(--font-mono);
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .theme-toggle {
            padding: 10px 20px;
            background: var(--primary);
            color: var(--primary-foreground);
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-family: var(--font-mono);
            margin-bottom: 20px;
        }
        .sidebar-preview {
            width: 100px;
            background: var(--sidebar);
            padding: 20px 10px;
            border-radius: var(--radius);
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>Theme Consistency Test</h1>
    
    <button class="theme-toggle" id="themeToggle">Toggle Theme</button>
    
    <div class="test-section">
        <h2>Sidebar Buttons Test</h2>
        <div class="sidebar-preview">
            <button class="sidebar-action" style="margin-bottom: 10px;">
                <span class="material-icons">download</span>
            </button>
            <button class="sidebar-action">
                <span class="material-icons">light_mode</span>
            </button>
        </div>
    </div>
    
    <div class="test-section">
        <h2>Shadow Variables Test</h2>
        <div style="background: var(--background); padding: 10px; border-radius: var(--radius); box-shadow: var(--shadow-sm); margin-bottom: 10px;">
            Shadow SM Test
        </div>
        <div style="background: var(--background); padding: 10px; border-radius: var(--radius); box-shadow: var(--shadow-md); margin-bottom: 10px;">
            Shadow MD Test
        </div>
        <div style="background: var(--background); padding: 10px; border-radius: var(--radius); box-shadow: var(--shadow-lg);">
            Shadow LG Test
        </div>
    </div>
    
    <div class="test-section">
        <h2>Blue Shadow Variables Test</h2>
        <div style="background: var(--background); padding: 10px; border-radius: var(--radius); box-shadow: var(--shadow-blue-sm); margin-bottom: 10px;">
            Blue Shadow SM Test
        </div>
        <div style="background: var(--background); padding: 10px; border-radius: var(--radius); box-shadow: var(--shadow-blue-md);">
            Blue Shadow MD Test
        </div>
    </div>
    
    <script>
        const themeToggle = document.getElementById('themeToggle');
        let isDark = false;
        
        themeToggle.addEventListener('click', () => {
            isDark = !isDark;
            const root = document.documentElement;
            
            if (isDark) {
                root.setAttribute('data-theme', 'dark');
                themeToggle.textContent = 'Switch to Light Theme';
            } else {
                root.setAttribute('data-theme', 'light');
                themeToggle.textContent = 'Switch to Dark Theme';
            }
            
            // Update all theme-dependent elements
            document.querySelectorAll('*').forEach(el => {
                el.style.transition = 'all 0.3s ease';
            });
        });
        
        // Load Material Icons
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/icon?family=Material+Icons';
        document.head.appendChild(link);
    </script>
</body>
</html>
