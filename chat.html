<!doctype html>
<html>
  <head>
    <title>LLM Chat</title>
    <!-- Material Icons - consider replacing with local SVG icons for privacy -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="chat.css" />
    <link rel="stylesheet" href="loading-states.css" />
    <link rel="stylesheet" href="libs/highlight-github.min.css" id="highlight-theme" />
  </head>
  <body>
<div id="quick-actions-sidebar">
  <!-- Theme toggle: first in sidebar (top-right area) -->
  <button id="themeToggleBtn" class="quick-action-button" title="Toggle dark theme">
    <span class="material-icons" id="darkThemeIcon">brightness_2</span>
    <span class="sidebar-label">Theme</span>
  </button>
  <input type="checkbox" id="darkThemeToggle" style="display: none;" />
  <!-- Static actions with text labels -->
  <button id="add-page-button" class="quick-action-button" title="Add page content to chat">
    <span class="material-icons">article</span>
    <span class="sidebar-label">Page</span>
  </button>
  <button id="analyze-button" class="quick-action-button" title="Analyze this tab">
    <span class="material-icons">auto_awesome</span>
    <span class="sidebar-label">Analyze</span>
  </button>
  <button id="analyze-dropdown" class="quick-action-button" title="Choose analysis mode">
    <span class="material-icons">arrow_drop_down</span>
    <span class="sidebar-label">Mode</span>
  </button>
  <button id="explain-button" class="quick-action-button" title="Explain this tab">
    <span class="material-icons">help_outline</span>
    <span class="sidebar-label">Explain</span>
  </button>
  <!-- Custom prompts dropdown -->
  <button id="custom-prompts-dropdown" class="quick-action-button" title="All Custom Prompts">
    <span class="material-icons">more_horiz</span>
    <span class="sidebar-label">Prompts</span>
  </button>
  <!-- Pinned instructions will be added here by chat.js -->
  <div id="pinned-actions-container"></div>
</div>
    <!-- Drag & Drop overlay -->
    <div id="drop-overlay" class="drop-overlay" style="display: none">
      <div class="drop-overlay-content">
        <span class="material-icons" style="font-size: 48px; margin-bottom: 12px;">cloud_upload</span>
        <p>Drop images or files here to analyze</p>
        <p class="drop-overlay-hint">Supports images, videos, and audio files</p>
      </div>
    </div>
    <div class="chat-container">
      <div id="chat-main-area" style="display: block">
        <div id="chat-area"></div>
        <div id="input-area">
          <div id="input-wrapper">
            <textarea
              id="user-input"
              placeholder="Type your message (or right-click to analyze)"
              rows="1"
            ></textarea>
            <button id="voice-toggle-button" title="Voice Input" type="button">
              <span class="material-icons">mic</span>
            </button>
          </div>
          <button id="send-button">Send</button>
          <button id="clear-button">Clear</button>
        </div>
      </div>

      <div id="oneoff-instruction-area" style="display: none">
        <h3>One-off Instruction</h3>
        <div>
          <p>Selected text:</p>
          <div id="selectedText" class="selected-text"></div>
        </div>
        <div>
          <p>Enter your instruction:</p>
          <textarea id="instructionInput" placeholder="Enter your instruction here..."></textarea>
        </div>
        <button id="submitBtn">Process</button>
      </div>
    </div>
    <script src="libs/highlight.min.js"></script>
    <script src="marked.min.js"></script>
    <script type="module" src="chat.js"></script>
    <script src="theme-toggle.js"></script>
  </body>
</html>
