<!DOCTYPE html>
<html>
<head>
    <title>LLM Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="chat.css">
    <link rel="stylesheet" href="loading-states.css">
</head>
<body>
    <div id="quick-actions-sidebar">
        <!-- Preset "Load Tab Content" button -->
        <button id="load-content-button" class="quick-action-button" title="Load tab content for discussion">
            <span class="material-icons">article</span>
        </button>
        <!-- Preset "Summarize this tab" button -->
        <button id="summarize-tab-button" class="quick-action-button" title="Smart Summarize">
            <span class="material-icons">auto_awesome</span>
        </button>
        <button id="explain-button" class="quick-action-button" title="Explain this tab">
            <span class="material-icons">help_outline</span>
        </button>
        <!-- Phase 4: Smart Summary Presets -->
        <button id="tldr-preset-button" class="quick-action-button preset-button" title="Smart TL;DR">
            <span class="material-icons">short_text</span>
        </button>
        <button id="tech-preset-button" class="quick-action-button preset-button" title="Smart Technical Analysis">
            <span class="material-icons">code</span>
        </button>
        <button id="exec-preset-button" class="quick-action-button preset-button" title="Executive summary">
            <span class="material-icons">assignment</span>
        </button>
        <!-- Pinned instructions will be added here by chat.js -->
        <div id="pinned-actions-container"></div>
        <!-- Manage Pinned Actions button removed as pinning is now handled in options.html -->
    </div>
    <div style="position: absolute; top: 10px; right: 20px; z-index: 200;">
      <label style="font-size: 0.95em; cursor: pointer; display: flex; align-items: center;">
        <input type="checkbox" id="darkThemeToggle">
        <span id="darkThemeIcon" style="margin-right: 4px; font-size: 1.2em; vertical-align: middle;" class="material-icons">brightness_2</span>
        Dark/Light Theme
      </label>
    </div>
    <div class="chat-container">
        <div id="chat-main-area" style="display: block;">
            <div id="chat-area"></div>
            <div id="input-area">
                <div id="input-wrapper">
                    <textarea id="user-input" placeholder="Type your message (or right-click to analyze)" rows="1"></textarea>
                    <button id="voice-toggle-button" title="Voice Input" type="button">
                        <span class="material-icons">mic</span>
                    </button>
                </div>
                <button id="send-button">Send</button>
                <button id="clear-button">Clear</button>
            </div>
        </div>

        <div id="oneoff-instruction-area" style="display:none;">
            <h3>One-off Instruction</h3>
            <div>
              <p>Selected text:</p>
              <div id="selectedText" class="selected-text"></div>
            </div>
            <div>
              <p>Enter your instruction:</p>
              <textarea id="instructionInput" placeholder="Enter your instruction here..."></textarea>
            </div>
            <button id="submitBtn">Process</button>
        </div>
    </div>
    <script src="marked.min.js"></script>
    <script type="module" src="chat.js"></script>
</body>
</html>
