<!doctype html>
<html>
  <head>
    <title>Prompt Paul</title>
    <link rel="stylesheet" href="libs/bootstrap.min.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="ui-primitives.css" />
    <link rel="stylesheet" href="chat.css" />
    <link rel="stylesheet" href="loading-states.css" />
    <link rel="stylesheet" href="libs/highlight-github.min.css" id="highlight-theme" />
  </head>
  <body>
    <a href="#user-input" class="skip-link">Skip to chat input</a>
    <div id="quick-actions-sidebar">
      <!-- Theme toggle: first in sidebar (top-right area) -->
      <button id="themeToggleBtn" class="quick-action-button" title="Toggle dark theme">
        <span class="sidebar-label">Theme</span>
      </button>
      <input type="checkbox" id="darkThemeToggle" class="hidden" />
      <!-- Static actions with text labels -->
      <button id="add-page-button" class="quick-action-button" title="Load page content">
        <span class="sidebar-label">Page</span>
      </button>
      <button
        id="analyze-button"
        class="quick-action-button"
        title="Analyze selected text"
        data-enabled-title="Analyze selected text"
      >
        <span class="sidebar-label">Analyze</span>
      </button>
      <button
        id="analyze-dropdown"
        class="quick-action-button"
        title="Choose selected-text mode"
        data-enabled-title="Choose selected-text mode"
      >
        <span class="sidebar-label">Mode</span>
      </button>
      <button
        id="proofread-button"
        class="quick-action-button"
        title="Proofread selected text"
        data-enabled-title="Proofread selected text"
      >
        <span class="sidebar-label">Proof</span>
      </button>
      <button
        id="explain-button"
        class="quick-action-button"
        title="Explain selected text"
        data-enabled-title="Explain selected text"
      >
        <span class="sidebar-label">Explain</span>
      </button>
      <button
        id="custom-prompts-dropdown"
        class="quick-action-button"
        title="Run selected-text prompt"
        data-enabled-title="Run selected-text prompt"
      >
        <span class="sidebar-label">Prompts</span>
      </button>
      <!-- Web Search toggle -->
      <button
        id="web-search-toggle"
        class="quick-action-button"
        title="Web search is off — click to enable grounding"
        aria-pressed="false"
      >
        <span class="sidebar-label">Web</span>
      </button>
      <!-- Pinned instructions will be added here by chat.js -->
      <div id="pinned-actions-container"></div>
    </div>
    <!-- Drag & Drop overlay -->
    <div id="drop-overlay" class="drop-overlay hidden">
      <div class="drop-overlay-content">
        <p class="drop-overlay-icon">&#x2B06;</p>
        <p>Drop images or files here to analyze</p>
        <p class="drop-overlay-hint">Supports images, videos, and audio files</p>
      </div>
    </div>
    <div class="chat-container">
      <main id="chat-main-area">
        <div id="chat-area"></div>
        <div id="input-area" data-run-state="idle" aria-busy="false">
          <div id="context-tray" class="ext-tray" hidden>
            <div id="attachment-strip" class="attachment-strip" hidden>
              <img
                id="attachment-thumbnail"
                class="attachment-thumbnail"
                alt="Pasted image preview"
              />
              <div class="attachment-copy">
                <span id="attachment-title" class="attachment-title">Image attached</span>
                <span id="attachment-details" class="attachment-details"
                  >Add any prompt or question, then press Send</span
                >
              </div>
              <button id="attachment-remove-button" class="attachment-remove-button" type="button">
                Remove
              </button>
            </div>
            <div id="selected-text-strip" class="attachment-strip selected-text-strip" hidden>
              <span class="material-symbols-outlined selected-text-strip-icon">format_quote</span>
              <div class="attachment-copy">
                <span class="attachment-title">Selected text attached</span>
                <span
                  id="selected-text-snippet"
                  class="attachment-details selected-text-snippet"
                ></span>
              </div>
              <button
                id="selected-text-remove-button"
                class="attachment-remove-button"
                type="button"
                title="Detach selected text and continue the conversation"
              >
                Remove
              </button>
            </div>
            <div id="page-context-strip" class="attachment-strip page-context-strip" hidden>
              <span class="material-symbols-outlined selected-text-strip-icon">description</span>
              <div class="attachment-copy">
                <span class="attachment-title">Page content</span>
                <span id="page-context-details" class="attachment-details"></span>
              </div>
              <button
                id="page-context-remove-button"
                class="attachment-remove-button"
                type="button"
                title="Detach page content and continue the conversation"
              >
                Remove
              </button>
            </div>
          </div>
          <div id="quick-actions-row" class="quick-actions-row" hidden>
            <span id="quick-actions-label" class="quick-actions-label">Quick actions</span>
          </div>
          <div id="input-controls">
            <div id="input-wrapper">
              <textarea
                id="user-input"
                class="form-control"
                placeholder="Type a prompt or paste an image"
                rows="1"
              ></textarea>
              <button
                id="voice-toggle-button"
                title="Voice Input"
                type="button"
                aria-label="Voice input"
              >
                <span class="material-symbols-outlined">mic</span>
              </button>
            </div>
            <button id="send-button" class="btn btn-primary">Send</button>
            <button id="clear-button" class="btn btn-danger">Clear</button>
          </div>
        </div>
      </main>

      <div id="oneoff-instruction-area" class="hidden">
        <h3>One-off Instruction</h3>
        <div>
          <p>Selected text:</p>
          <div id="selectedText" class="selected-text"></div>
        </div>
        <div>
          <p>Enter your instruction:</p>
          <textarea id="instructionInput" placeholder="Enter your instruction here..."></textarea>
        </div>
        <button id="submitBtn">Process</button>
      </div>
    </div>
    <script src="libs/highlight.min.js"></script>
    <script src="libs/dompurify.min.js"></script>
    <script src="libs/bootstrap.bundle.min.js"></script>
    <script src="marked.min.js"></script>
    <script type="module" src="chat.js"></script>
    <script src="theme-toggle.js"></script>
  </body>
</html>
