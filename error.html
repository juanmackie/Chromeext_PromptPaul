<!doctype html>
<html>
  <head>
    <title>Error - Prompt Paul</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      .error-page {
        max-width: 600px;
        margin: 2rem auto;
        padding: 1.5rem;
      }
      .error-page h1 {
        color: var(--ext-destructive);
        font-size: 1.5rem;
        margin: 0 0 1rem 0;
      }
      .error-page pre {
        white-space: pre-wrap;
        word-wrap: break-word;
        background-color: var(--ext-card);
        border: 1px solid var(--ext-border);
        border-radius: 0px;
        padding: 1rem;
        font-size: 0.875rem;
        font-family: var(--ext-font-family);
        color: var(--ext-foreground);
        box-shadow: var(--ext-shadow-sm);
      }
      .error-page .back-link {
        display: inline-block;
        margin-top: 1rem;
        color: var(--ext-primary);
        text-decoration: none;
        font-weight: 500;
      }
      .error-page .back-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="error-page">
      <h1>Error</h1>
      <pre id="error-message"></pre>
      <a href="javascript:history.back()" class="back-link">Go Back</a>
    </div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const errorMessage = urlParams.get('message');
      if (errorMessage) {
        const decodedErrorMessage = decodeURIComponent(errorMessage);
        document.getElementById('error-message').textContent = decodedErrorMessage;
      } else {
        document.getElementById('error-message').textContent = 'No error message available.';
      }
    </script>
  </body>
</html>
