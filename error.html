<!DOCTYPE html>
<html>
<head>
  <title>Prompt Paul - Error</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined&display=swap" rel="stylesheet">
  <style>
    :root {
      --ext-background: #fafafa;
      --ext-foreground: #1a1a2e;
      --ext-card: #ffffff;
      --ext-primary: #5046e5;
      --ext-primary-deep: #4338ca;
      --ext-muted: #f1f0f5;
      --ext-muted-foreground: #6b6b7b;
      --ext-border: #e0dff0;
      --ext-destructive: #e53e3e;
      --ext-shadow-color: rgba(80, 70, 229, 0.15);
      --ext-shadow: 3px 3px 0px 0px var(--ext-shadow-color);
      --ext-shadow-md: 4px 4px 0px 0px var(--ext-shadow-color);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'JetBrains Mono', 'SF Mono', 'Monaco', monospace;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      background-color: var(--ext-background);
      color: var(--ext-foreground);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .error-container {
      background: var(--ext-card);
      border: 2px solid var(--ext-border);
      box-shadow: var(--ext-shadow-lg);
      padding: 2.5rem;
      max-width: 600px;
      width: 90%;
      position: relative;
    }

    .error-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--ext-destructive) 0%, #f87171 100%);
      border-bottom: 1px solid #991b1b;
    }

    h1 {
      color: var(--ext-destructive);
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 1rem 0;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    .error-icon {
      color: var(--ext-destructive);
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      background-color: var(--ext-muted);
      border: 1px solid var(--ext-border);
      box-shadow: var(--ext-shadow);
      padding: 1rem;
      font-size: 0.875rem;
      line-height: 1.5;
      color: var(--ext-foreground);
      margin: 0;
    }

    .error-message {
      margin-top: 1rem;
      color: var(--ext-muted-foreground);
      font-size: 0.875rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      padding: 0.75rem 1.25rem;
      background-color: var(--ext-primary);
      color: #ffffff;
      border: 2px solid var(--ext-primary-deep);
      border-left: 6px solid var(--ext-primary-deep);
      box-shadow: var(--ext-shadow);
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .back-link:hover {
      transform: translate(-2px, -2px);
      box-shadow: var(--ext-shadow-md);
    }

    .back-link:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px 0px var(--ext-shadow-color);
    }
  </style>
</head>
<body>
  <div class="error-container">
    <span class="material-symbols-outlined error-icon">error</span>
    <h1>Error</h1>
    <pre id="error-message"></pre>
    <p class="error-message">Something went wrong. Please try again.</p>
    <a href="javascript:history.back()" class="back-link">
      <span class="material-symbols-outlined" style="font-size: 1.2em;">arrow_back</span>
      Go Back
    </a>
  </div>
  <script src="error.js"></script>
</body>
</html>
