<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Document Upload Test</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="chat.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="hextaui-components.css">
    <link rel="stylesheet" href="loading-states.css">
    <style>
        body {
            font-family: var(--font-geist);
            padding: 20px;
            background: var(--background);
            color: var(--foreground);
        }
        .test-container {
            max-width: 400px;
            margin: 0 auto;
        }
        .test-status {
            padding: 10px;
            margin: 10px 0;
            border-radius: var(--radius);
        }
        .success { background: rgba(var(--success-rgb), 0.1); color: var(--success); }
        .error { background: rgba(var(--destructive-rgb), 0.1); color: var(--destructive); }
    </style>
</head>
<body>
    <div class="test-container">
        <h2>Document Upload CSP Test</h2>
        <div id="test-status"></div>
        
        <div id="document-sidebar" class="document-sidebar visible">
            <div class="document-panel-header">
                <h4><span class="material-icons icon-inline">description</span>Documents</h4>
            </div>
            <div id="document-drop-zone" class="drop-zone">
                <span class="material-icons upload-icon-large">cloud_upload</span>
                <p class="upload-title">Drop documents here</p>
                <span class="upload-hint">PDF, DOCX, CSV, MD, TXT</span>
            </div>
            <div id="document-list" class="document-list"></div>
            <button id="clear-all-docs" class="hextaui-btn hextaui-btn-outline hidden">Clear All</button>
        </div>
    </div>

    <script type="module">
        import { DocumentUI } from './chat/document-ui.js';
        import { DocumentManager } from './chat/document-manager.js';
        import { UIManager } from './chat/ui-manager.js';

        const status = document.getElementById('test-status');

        function addStatus(message, type = 'success') {
            const div = document.createElement('div');
            div.className = `test-status ${type}`;
            div.textContent = message;
            status.appendChild(div);
        }

        try {
            // Test UIManager methods exist
            const uiManager = new UIManager(document.getElementById('chat-area'), null, null);
            
            if (typeof uiManager.updateStatus === 'function') {
                addStatus('✓ UIManager.updateStatus method exists');
            } else {
                addStatus('✗ UIManager.updateStatus method missing', 'error');
            }

            if (typeof uiManager.updateDocument === 'function') {
                addStatus('✓ UIManager.updateDocument method exists');
            } else {
                addStatus('✗ UIManager.updateDocument method missing', 'error');
            }

            if (typeof uiManager.showError === 'function') {
                addStatus('✓ UIManager.showError method exists');
            } else {
                addStatus('✗ UIManager.showError method missing', 'error');
            }

            // Test DocumentUI instantiation and CSP compliance
            const documentSidebar = document.getElementById('document-sidebar');
            const ragManager = { indexDocument: async () => {}, removeDocument: async () => {} };
            const documentManager = new DocumentManager(ragManager, uiManager);
            const documentUI = new DocumentUI(documentSidebar, documentManager);
            
            documentUI.initialize();
            addStatus('✓ DocumentUI initialized without CSP violations');

            // Test that CSS classes are applied instead of inline styles
            const dropZone = document.getElementById('document-drop-zone');
            const uploadIcon = dropZone.querySelector('.upload-icon-large');
            
            if (uploadIcon && !uploadIcon.hasAttribute('style')) {
                addStatus('✓ CSP compliance: No inline styles on upload icon');
            } else {
                addStatus('✗ CSP violation: Inline styles found', 'error');
            }

            addStatus('All tests passed! Document upload should work without CSP errors.', 'success');

        } catch (error) {
            addStatus(`✗ Test failed: ${error.message}`, 'error');
            console.error('Test error:', error);
        }
    </script>
</body>
</html>
