<!-- Options Configuration Forms Template -->
<div class="config-grid">
  <!-- LLM Configuration Card -->
  <div class="card config-card">
    <h2>🤖 LLM Configuration</h2>
    <div class="form-group">
      <label for="llmEndpoint">LLM API Endpoint:</label>
      <input type="text" id="llmEndpoint" placeholder="https://api.openai.com/v1/chat/completions" required>
    </div>
    <div class="form-group">
      <label for="apiKey">API Key:</label>
      <input type="text" id="apiKey" placeholder="Your API key" required>
    </div>
    <div class="form-group">
      <label for="modelName">Model Name:</label>
      <input type="text" id="modelName" placeholder="gpt-4o-mini" required>
    </div>
    <div class="form-group">
      <label for="systemPrompt">System Prompt (Optional):</label>
      <textarea id="systemPrompt" rows="4" placeholder="You are a helpful assistant..."></textarea>
    </div>
    <button id="saveConfig" class="btn-primary">💾 Save Configuration</button>
  </div>

  <!-- Profile Management Card -->
  <div class="card config-card">
    <h2>👤 Profile Management</h2>
    <div class="form-group">
      <label for="profileSelect">Active Profile:</label>
      <select id="profileSelect">
        <option value="default">Default Profile</option>
      </select>
    </div>
    <div class="form-group">
      <label for="profileName">Profile Name:</label>
      <input type="text" id="profileName" placeholder="Enter profile name">
    </div>
    <div class="button-group">
      <button id="createProfile" class="btn-primary">➕ Create Profile</button>
      <button id="deleteProfile" class="btn-destructive">🗑️ Delete Profile</button>
    </div>
  </div>
</div>
