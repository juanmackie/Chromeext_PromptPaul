<!-- Options Tools Section Template -->
<section class="section-card">
  <div class="section-header">
    <h2 class="section-title collapsible-header">
      <span class="material-symbols-outlined section-icon">build</span>
      Tools
      <span class="collapsible-icon material-symbols-outlined">expand_more</span>
    </h2>
    <div class="section-divider"></div>
  </div>
  <div class="collapsible-content">
    <div id="tools-list">
      <div class="table-container">
        <table id="toolsTable" class="responsive-table">
          <thead class="sticky-header">
            <tr>
              <th>Name</th>
              <th>Description</th>
              <th>MCP Server</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- Tools will be populated here by options.js -->
          </tbody>
        </table>
      </div>
      
      <!-- Mobile card view for tools -->
      <div class="mobile-cards">
        <!-- Mobile cards will be populated here by options.js -->
      </div>
    </div>

    <!-- Tool Form -->
    <div class="tool-form card">
      <h3 id="toolFormTitle">Add New Tool</h3>
      <form id="toolForm">
        <div class="form-group">
          <label for="toolName">Tool Name:</label>
          <input type="text" id="toolName" placeholder="e.g., search_web" required>
        </div>
        <div class="form-group">
          <label for="toolDescription">Description:</label>
          <textarea id="toolDescription" rows="3" placeholder="e.g., Search the web for information" required></textarea>
        </div>
        <div class="form-group">
          <label for="toolSchema">Schema (JSON):</label>
          <textarea id="toolSchema" rows="6" placeholder='{"type": "object", "properties": {...}}'></textarea>
        </div>
        <div class="form-group">
          <label for="toolMcpServer">MCP Server URL (optional):</label>
          <input type="text" id="toolMcpServer" placeholder="wss://server.example.com/ws">
        </div>
        <div class="button-group">
          <button type="submit" id="saveToolBtn" class="save-tool-button">🔧 Save Tool</button>
          <button type="button" id="clearToolFormBtn" class="clear-form-button">🧹 Clear Form</button>
        </div>
      </form>
    </div>

    <!-- Import/Export Tools Section -->
    <div class="import-export card">
      <h3>📤 Import/Export Tools</h3>
      <div class="button-group">
        <button id="exportTools" class="export-button">📥 Export Tools</button>
        <input type="file" id="importToolsFile" accept=".json" style="display: none;">
        <button id="importTools" class="import-button">📤 Import Tools</button>
      </div>
    </div>

    <!-- MCP Servers Section -->
    <div class="mcp-servers card">
      <h3>🔗 MCP Servers</h3>
      <div id="mcp-servers-list">
        <!-- MCP servers will be populated here -->
      </div>
      <button id="addMcpServerBtn" class="btn-primary">➕ Add MCP Server</button>
    </div>

    <!-- MCP Server Modal -->
    <div id="mcpServerModal" class="modal" style="display: none;">
      <div class="modal-content">
        <h3 id="mcpModalTitle">Add MCP Server</h3>
        <div class="form-group">
          <label for="mcpName">Name</label>
          <input id="mcpName" type="text" placeholder="My Server">
        </div>
        <div class="form-group">
          <label for="mcpUrl">WSS URL</label>
          <input id="mcpUrl" type="text" placeholder="wss://server.example.com/ws">
          <div id="mcpUrlError" class="error-message"></div>
        </div>
        <div class="form-group">
          <label for="mcpAuth">Authorization (Bearer ...)</label>
          <input id="mcpAuth" type="password" placeholder="Bearer TOKEN (optional)">
        </div>
        <div class="form-row" style="display:flex; gap:12px; flex-wrap:wrap;">
          <label class="inline"><input type="checkbox" id="mcpAllowlisted"> Allowlisted</label>
          <label class="inline"><input type="checkbox" id="mcpEnabled" checked> Enabled</label>
          <label class="inline"><input type="checkbox" id="mcpSensitiveConfirm" checked> Sensitive tools require confirm</label>
        </div>
        <div class="form-row" style="display:grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap:12px;">
          <div class="form-group small">
            <label for="mcpTimeout">Call Timeout (ms)</label>
            <input id="mcpTimeout" type="number" value="20000" min="1000" step="500">
          </div>
          <div class="form-group small">
            <label for="mcpBackoffBase">Backoff Base (ms)</label>
            <input id="mcpBackoffBase" type="number" value="500" min="100" step="100">
          </div>
          <div class="form-group small">
            <label for="mcpBackoffMax">Backoff Max (ms)</label>
            <input id="mcpBackoffMax" type="number" value="10000" min="1000" step="500">
          </div>
          <div class="form-group small">
            <label for="mcpBackoffFactor">Backoff Factor</label>
            <input id="mcpBackoffFactor" type="number" value="2" min="1" step="0.1">
          </div>
          <div class="form-group small">
            <label for="mcpBackoffJitter">Backoff Jitter</label>
            <input id="mcpBackoffJitter" type="number" value="0.2" min="0" step="0.05">
          </div>
        </div>
        <div class="form-row" style="display:flex; gap:8px; justify-content:flex-end;">
          <button id="mcpSaveServerBtn" class="btn-primary">Save</button>
          <button id="mcpCancelServerBtn" class="btn-secondary">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</section>
