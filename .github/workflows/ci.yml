name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run validation
        run: npm run validate

      - name: Run dependency audit
        run: npm run audit

  browser:
    runs-on: ubuntu-latest
    needs: validate
    env:
      PROMPT_PAUL_LOAD_EXTENSION_DIR: dist

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production output
        run: npm run build:prod

      - name: Stage browser-test harness into dist
        run: npm run stage:browser-harness

      - name: Run browser tests against production output
        run: xvfb-run --auto-servernum npm run test:browser

  build:
    runs-on: ubuntu-latest
    needs: [validate, browser]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build:prod

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prompt-paul-extension
          path: dist/
          retention-days: 7
