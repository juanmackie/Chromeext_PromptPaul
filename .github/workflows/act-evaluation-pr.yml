name: Act score gate

on:
  pull_request:
    paths:
      - 'content_script_page_actions.js'
      - 'background.js'
      - 'src/background/**'
      - 'src/act/**'
      - 'src/orchestrator/**'
      - 'src/utils/pageAction*.js'
      - 'src/utils/pageDom.js'
      - 'scripts/act-benchmark.js'
      - 'scripts/compare-act-scores.js'
      - 'tests/browser/fixtures/act-*.html'
      - '.github/workflows/act-evaluation-pr.yml'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROMPT_PAUL_BENCHMARK_API_KEY: ${{ secrets.ACT_EVAL_API_KEY }}
      PROMPT_PAUL_BENCHMARK_MODEL: gpt-4.1-mini
      PROMPT_PAUL_BENCHMARK_PROVIDER: api
      PROMPT_PAUL_BENCHMARK_EXTENSION_DIR: dist-eval
    steps:
      - name: Require Act evaluation API key
        run: |
          if [ -z "$PROMPT_PAUL_BENCHMARK_API_KEY" ]; then
            echo "::error::Configure the ACT_EVAL_API_KEY repository secret to run the Act score gate."
            exit 1
          fi

      - name: Checkout PR base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build baseline evaluation extension
        run: npm run build:eval

      - name: Score PR base on the fixed local corpus
        run: xvfb-run --auto-servernum npm run benchmark:act -- --run --runs 2 --task search-enter --task prefilled-form --task validation-error

      - name: Preserve baseline score
        uses: actions/upload-artifact@v4
        with:
          name: act-score-baseline
          path: artifacts/act-benchmark/results.json
          retention-days: 1

  candidate:
    runs-on: ubuntu-latest
    needs: baseline
    timeout-minutes: 45
    env:
      PROMPT_PAUL_BENCHMARK_API_KEY: ${{ secrets.ACT_EVAL_API_KEY }}
      PROMPT_PAUL_BENCHMARK_MODEL: gpt-4.1-mini
      PROMPT_PAUL_BENCHMARK_PROVIDER: api
      PROMPT_PAUL_BENCHMARK_EXTENSION_DIR: dist-eval
    steps:
      - name: Require Act evaluation API key
        run: |
          if [ -z "$PROMPT_PAUL_BENCHMARK_API_KEY" ]; then
            echo "::error::Configure the ACT_EVAL_API_KEY repository secret to run the Act score gate."
            exit 1
          fi

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build candidate evaluation extension
        run: npm run build:eval

      - name: Score PR head on the fixed local corpus
        run: xvfb-run --auto-servernum npm run benchmark:act -- --run --runs 2 --task search-enter --task prefilled-form --task validation-error

      - name: Download baseline score
        uses: actions/download-artifact@v4
        with:
          name: act-score-baseline
          path: baseline

      - name: Require score to hold or improve
        run: node scripts/compare-act-scores.js baseline/results.json artifacts/act-benchmark/results.json
