name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate release metadata from changelog
        run: npm run release:prepare

      - name: Verify tag matches release version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

      - name: Run CI
        run: npm run ci

      - name: Build production extension
        run: npm run build:prod

      - name: Package release assets
        run: |
          cd dist
          zip -qr ../prompt-paul-${GITHUB_REF_NAME}.zip .
          cd ..
          sha256sum prompt-paul-${GITHUB_REF_NAME}.zip > SHA256SUMS
          cp dist/build-metadata.json build-metadata.json

      - name: Upload to Chrome Web Store
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          npx --yes --package chrome-webstore-upload-cli@4.0.2 chrome-webstore-upload \
            --source "prompt-paul-${GITHUB_REF_NAME}.zip" \
            --extension-id "$EXTENSION_ID"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## \[Unreleased\]/{exit} /^## \[/{if (seen) exit; seen=1} seen{print}' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            "prompt-paul-${GITHUB_REF_NAME}.zip" SHA256SUMS build-metadata.json \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md
