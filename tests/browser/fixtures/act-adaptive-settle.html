<!doctype html>
<meta charset="utf-8" />
<title>Action-triggered busy work</title>
<div role="progressbar">Existing background activity</div>
<button id="load">Load result</button>
<output id="result"></output>
<script>
  document.querySelector('#load').onclick = () => {
    const result = document.querySelector('#result');
    result.setAttribute('aria-busy', 'true');
    setTimeout(() => {
      result.textContent = 'Cedar result ready';
      result.removeAttribute('aria-busy');
    }, 1400);
  };
</script>
