<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Outlook compose fixture</title>
  </head>
  <body>
    <main aria-label="Outlook compose">
      <input id="outlook-to" aria-label="To" placeholder="Recipients" autocomplete="off" />
      <input id="outlook-subject" aria-label="Subject" placeholder="Subject" />
      <div id="outlook-body" contenteditable="true" role="textbox" aria-label="Message body">
        Outlook draft
      </div>
      <button id="outlook-save" type="button">Save draft</button>
    </main>
  </body>
</html>
