<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Targeting Fixture</title>
  </head>
  <body>
    <main>
      <h1 id="heading">Saved searches</h1>
      <button id="icon-action" type="button" aria-labelledby="icon-action-label">
        <span aria-hidden="true">⋯</span>
        <span id="icon-action-label">Create saved search</span>
      </button>
      <label id="query-label" for="query">Search query</label>
      <input id="query" name="query" />
      <label for="scope">Search scope</label>
      <select id="scope" aria-label="Search scope">
        <option>All messages</option>
        <option>Unread messages</option>
      </select>
    </main>
  </body>
</html>
