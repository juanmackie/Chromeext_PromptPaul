<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Northwind Plan (Vendor A)</title>
  </head>
  <body>
    <main>
      <h1 id="vendor">Vendor A plan</h1>
      <table id="spec">
        <thead>
          <tr>
            <th>Item</th>
            <th>Value</th>
          </tr>
        </thead>
        <tbody>
          <tr class="metric">
            <td>Monthly price</td>
            <td class="value">24</td>
          </tr>
          <tr class="metric">
            <td>Seats included</td>
            <td class="value">5</td>
          </tr>
          <tr class="metric">
            <td>Storage gigabytes</td>
            <td class="value">100</td>
          </tr>
        </tbody>
      </table>
      <p id="vendor-summary">
        Vendor A charges 24 per month for 5 seats and 100 gigabytes of storage.
      </p>
    </main>
  </body>
</html>
