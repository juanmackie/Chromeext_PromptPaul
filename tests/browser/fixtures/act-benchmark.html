<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prompt Paul local Act benchmark</title>
    <style>
      body {
        font: 16px/1.5 sans-serif;
        margin: 2rem;
      }
      button,
      input,
      [role] {
        margin: 0.25rem;
        padding: 0.5rem;
      }
      [hidden] {
        display: none !important;
      }
      #long-copy {
        max-width: 55rem;
      }
      #scroll-list {
        height: 260px;
        overflow: auto;
        border: 1px solid #777;
      }
      .row {
        display: flex;
        gap: 1rem;
        padding: 0.5rem;
      }
      iframe {
        width: 100%;
        height: 240px;
        border: 1px solid #777;
      }
    </style>
  </head>
  <body>
    <main id="task"></main>
    <script>
      const root = document.querySelector('#task');
      const params = new URLSearchParams(location.search);
      const kind = params.get('case') || '';
      const el = (tag, attrs = {}, text = '') => {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(attrs)) {
          if (key === 'className') node.className = value;
          else if (key === 'html') node.innerHTML = value;
          else node.setAttribute(key, value);
        }
        if (text) node.textContent = text;
        return node;
      };
      const button = (text, attrs = {}) => el('button', { type: 'button', ...attrs }, text);
      const mark = (name, value) => {
        document.body.dataset[name] = value;
      };

      if (kind === 'search-enter') {
        const search = el('input', { type: 'search', 'aria-label': 'Search' });
        search.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') mark('searched', search.value);
        });
        root.append(search);
      } else if (kind === 'escape-modal') {
        const dialog = el(
          'section',
          { role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Notice', tabindex: '0' },
          'Press Escape to dismiss this notice.'
        );
        dialog.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') {
            dialog.hidden = true;
            mark('dismissed', 'true');
          }
        });
        root.append(dialog);
        dialog.focus();
      } else if (kind === 'hover-menu') {
        const menu = button('Products', { 'aria-expanded': 'false' });
        const list = el('div', { role: 'menu', hidden: '' });
        const option = button('Analytics');
        menu.addEventListener('mouseover', () => {
          list.hidden = false;
          menu.setAttribute('aria-expanded', 'true');
        });
        option.addEventListener('click', () => mark('selection', 'analytics'));
        list.append(option);
        root.append(menu, list);
      } else if (kind === 'background-tab') {
        root.append(
          el('a', { href: 'act-hidden-settle.html', target: '_blank' }, 'Background notes')
        );
      } else if (kind === 'viewport-read') {
        root.append(el('p', {}, 'Archive '.repeat(7_000)));
        const marker = el('p', {}, 'The verification code is ORBIT-64.');
        root.append(marker, el('input', { id: 'verification', 'aria-label': 'Verification code' }));
        marker.scrollIntoView();
      } else if (kind === 'prefilled-form') {
        for (const [label, value] of [
          ['Name', 'Ada'],
          ['City', 'Brisbane'],
          ['Team', 'Birch'],
        ]) {
          const input = el('input', { 'aria-label': label, value });
          input.dataset.edits = '0';
          input.addEventListener('input', () => {
            input.dataset.edits = String(Number(input.dataset.edits) + 1);
          });
          root.append(input);
        }
      } else if (kind === 'range-date') {
        root.append(
          el('input', { type: 'range', id: 'volume', 'aria-label': 'Volume', value: '20' }),
          el('input', {
            type: 'date',
            id: 'date',
            'aria-label': 'Appointment date',
            value: '2026-10-01',
          })
        );
      } else if (kind === 'nested-scroll') {
        const panel = el('div', {
          id: 'scroll-list',
          tabindex: '0',
          'aria-label': 'Activity panel',
        });
        for (let index = 0; index < 30; index += 1) panel.append(el('p', {}, `Activity ${index}`));
        const choose = button('Select Cedar');
        choose.addEventListener('click', () => mark('selection', 'cedar'));
        panel.append(choose);
        root.append(panel);
      } else if (kind === 'cross-origin-iframe') {
        const child = new URL(location.href);
        child.hostname = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
        child.search = '?case=iframe-child';
        const frame = el('iframe', { title: 'Contact form', src: child.href });
        window.addEventListener('message', (event) => {
          if (
            event.source === frame.contentWindow &&
            event.origin === child.origin &&
            event.data?.type === 'fixture-submitted'
          )
            mark('submitted', String(event.data.name || ''));
        });
        root.append(frame);
      } else if (kind === 'trusted-key-only') {
        const input = el('input', { 'aria-label': 'Ready', value: 'ready' });
        input.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' && event.isTrusted) mark('trustedKey', 'true');
        });
        root.append(input);
      } else if (kind.startsWith('gmail-')) {
        const sort = button('Showing most relevant', {
          'aria-label': 'Sort order',
          'aria-expanded': 'false',
        });
        const menu = el('div', { role: 'menu', 'aria-label': 'Sort messages', hidden: '' });
        const inbox = el('div', { role: 'grid', 'aria-label': 'Inbox', id: 'inbox' });
        const opened = el('output', { id: 'opened', 'aria-label': 'Opened subjects' });
        const back = button('Back to Inbox', { id: 'back', hidden: '' });
        const thread = el('section', { id: 'thread', hidden: '' });
        const toggle = button('Show categories', { id: 'toggle-trap', 'aria-pressed': 'false' });
        const categories = el('p', { hidden: '' }, 'Category widgets are open.');
        toggle.dataset.activations = '0';
        const names = ['Quarterly report', 'Project update', 'Travel receipt'];
        const openedSubjects = [];
        sort.addEventListener('click', () => {
          menu.hidden = !menu.hidden;
          sort.setAttribute('aria-expanded', String(!menu.hidden));
        });
        for (const [index, name] of names.entries()) {
          const row = el('div', { role: 'row', 'data-subject': name });
          const link = button(`${name} — Sender`, { 'aria-label': `Open ${name}` });
          link.addEventListener('click', () => {
            openedSubjects.push(name);
            opened.textContent = openedSubjects.join(' | ');
            inbox.hidden = true;
            sort.hidden = true;
            thread.hidden = false;
            thread.textContent = name;
            back.hidden = false;
            location.hash = `message/${index + 1}`;
          });
          row.append(link);
          inbox.append(row);
        }
        for (const value of ['Most relevant', 'Most recent']) {
          const item = el(
            'div',
            {
              role: 'menuitemradio',
              tabindex: '-1',
              'aria-checked': String(value === 'Most relevant'),
              'data-sort': value === 'Most recent' ? 'recent' : 'relevant',
            },
            value
          );
          item.addEventListener('click', () => {
            for (const option of menu.querySelectorAll('[role="menuitemradio"]')) {
              option.setAttribute('aria-checked', String(option === item));
            }
            sort.textContent = `Showing ${value.toLowerCase()}`;
            document.body.dataset.sort = item.dataset.sort;
            menu.hidden = true;
            sort.setAttribute('aria-expanded', 'false');
          });
          menu.append(item);
        }
        back.addEventListener('click', () => {
          thread.hidden = true;
          inbox.hidden = false;
          sort.hidden = false;
          back.hidden = true;
          location.hash = 'inbox';
        });
        toggle.addEventListener('click', () => {
          const expanded = toggle.getAttribute('aria-pressed') !== 'true';
          toggle.dataset.activations = String(Number(toggle.dataset.activations) + 1);
          toggle.setAttribute('aria-pressed', String(expanded));
          categories.hidden = !expanded;
        });
        root.append(sort, menu, back, thread, inbox, toggle, categories, opened);
      } else if (kind === 'spa-menu') {
        const menu = button('Products', { 'aria-expanded': 'false' });
        const options = el('div', { role: 'menu', hidden: '' });
        const item = button('Analytics', { role: 'menuitem' });
        item.addEventListener('click', () => {
          mark('selection', 'analytics');
          options.hidden = true;
        });
        menu.addEventListener('click', () => {
          options.hidden = false;
          menu.setAttribute('aria-expanded', 'true');
        });
        options.append(item);
        root.append(menu, options);
      } else if (kind === 'autocomplete') {
        const input = el('input', {
          'aria-label': 'Choose a spice',
          role: 'combobox',
          'aria-autocomplete': 'list',
          'aria-expanded': 'false',
        });
        const list = el('div', { role: 'listbox', hidden: '' });
        input.addEventListener('input', () => {
          list.replaceChildren();
          if (!input.value) {
            list.hidden = true;
            return;
          }
          for (const name of ['Saffron', 'Sage', 'Star anise']) {
            if (name.toLowerCase().startsWith(input.value.toLowerCase())) {
              const option = el('div', { role: 'option' }, name);
              option.addEventListener('click', () => {
                input.value = name;
                mark('selection', name);
                list.hidden = true;
                input.setAttribute('aria-expanded', 'false');
              });
              list.append(option);
            }
          }
          list.hidden = list.childElementCount === 0;
          input.setAttribute('aria-expanded', String(!list.hidden));
        });
        root.append(input, list);
      } else if (kind === 'custom-radio') {
        const group = el('div', { role: 'radiogroup', 'aria-label': 'Meal preference' });
        for (const [name, value] of [
          ['Standard', 'standard'],
          ['Vegetarian', 'vegetarian'],
        ]) {
          const option = el('div', { role: 'radio', 'aria-checked': 'false', tabindex: '0' }, name);
          option.addEventListener('click', () => {
            for (const sibling of group.children) sibling.setAttribute('aria-checked', 'false');
            option.setAttribute('aria-checked', 'true');
            mark('selection', value);
          });
          group.append(option);
        }
        root.append(group);
      } else if (kind === 'custom-dropdown') {
        const combo = el(
          'div',
          { role: 'combobox', 'aria-label': 'Country', 'aria-expanded': 'false', tabindex: '0' },
          'Choose a country'
        );
        const list = el('div', { role: 'listbox', hidden: '' });
        for (const country of ['Canada', 'Japan', 'New Zealand']) {
          const option = el('div', { role: 'option' }, country);
          option.addEventListener('click', () => {
            combo.textContent = country;
            combo.setAttribute('aria-expanded', 'false');
            list.hidden = true;
            mark('selection', country);
          });
          list.append(option);
        }
        combo.addEventListener('click', () => {
          list.hidden = false;
          combo.setAttribute('aria-expanded', 'true');
        });
        root.append(combo, list);
      } else if (kind === 'shadow-control') {
        const host = el('benchmark-control');
        const shadow = host.attachShadow({ mode: 'open' });
        const control = button('Choose blue');
        control.addEventListener('click', () => mark('selection', 'blue'));
        shadow.append(control);
        root.append(host);
      } else if (kind === 'iframe-form') {
        const frame = el('iframe', { title: 'Contact form', src: '?case=iframe-child' });
        root.append(frame);
      } else if (kind === 'modal-dismissal') {
        const dialog = el('section', { role: 'dialog', 'aria-label': 'Notice' });
        const close = button('Close dialog');
        close.addEventListener('click', () => {
          dialog.hidden = true;
          mark('dismissed', 'true');
        });
        dialog.append(el('p', {}, 'A notice must be dismissed.'), close);
        root.append(dialog);
      } else if (kind === 'pagination') {
        const page = el('p', { id: 'page-content' }, 'Page 1: shipment is being prepared.');
        const next = button('Next page');
        next.addEventListener('click', () => {
          page.textContent = 'Page 2: shipment has arrived.';
          mark('page', '2');
        });
        root.append(page, next);
      } else if (kind === 'infinite-scroll') {
        const list = el('div', { id: 'scroll-list', tabindex: '0', 'aria-label': 'Activity feed' });
        // Enough rows to overflow the 260px box, otherwise the container never
        // scrolls and the lazy-loaded target can never be revealed.
        for (let index = 1; index <= 20; index += 1) {
          list.append(el('p', {}, `Entry ${index}: archived activity row`));
        }
        let loaded = false;
        list.addEventListener('scroll', () => {
          if (loaded || list.scrollTop <= 0) return;
          loaded = true;
          const target = button('Select Cedar');
          target.id = 'target-entry';
          target.addEventListener('click', () => mark('selection', 'cedar'));
          list.append(target);
          mark('loaded', 'true');
        });
        root.append(list);
      } else if (kind === 'long-page') {
        root.append(el('p', { id: 'long-copy' }, 'Archive '.repeat(7_000)));
        root.append(el('p', {}, 'The verification marker is ORBIT-47.'));
        const confirm = button('Confirm ORBIT-47');
        confirm.addEventListener('click', () => mark('confirmed', 'ORBIT-47'));
        root.append(confirm);
      } else if (kind === 'duplicate-row-buttons') {
        for (const name of ['Alder', 'Birch', 'Cedar']) {
          const row = el('section', { className: 'row', 'data-row': name });
          const label = el('span', {}, name);
          const archive = button('Archive');
          archive.addEventListener('click', () => {
            row.dataset.archived = 'true';
          });
          row.append(label, archive);
          root.append(row);
        }
      } else if (kind === 'validation-error') {
        // Succeeds only when the model reads the field error and corrects the
        // rejected value. The email starts invalid with a visible error and an
        // alert notice, mirroring an SPA form after a failed submit.
        const alert = el(
          'div',
          { role: 'alert' },
          'Submission failed. Correct the highlighted field.'
        );
        const emailError = el('p', { id: 'email-error' }, 'Enter a valid email address.');
        const email = el('input', {
          id: 'email',
          type: 'email',
          'aria-label': 'Email',
          'aria-invalid': 'true',
          'aria-errormessage': 'email-error',
          value: 'not-an-email',
        });
        const submit = button('Submit');
        email.addEventListener('input', () => {
          const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value);
          email.setAttribute('aria-invalid', String(!valid));
          if (valid) {
            email.removeAttribute('aria-errormessage');
            emailError.textContent = '';
            // Validation only clears the error. Submission is a separate step,
            // so the notice must not read as success before Submit is pressed.
            alert.textContent = 'Email looks valid. Submit to continue.';
          } else {
            email.setAttribute('aria-errormessage', 'email-error');
            emailError.textContent = 'Enter a valid email address.';
            alert.textContent = 'Submission failed. Correct the highlighted field.';
          }
        });
        submit.addEventListener('click', () => {
          const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value);
          if (valid) {
            alert.textContent = 'Submission accepted.';
            mark('emailValid', 'true');
          } else {
            alert.textContent = 'Submission failed. Correct the highlighted field.';
            mark('emailValid', 'false');
          }
        });
        root.append(alert, email, emailError, submit);
      } else if (kind === 'iframe-child') {
        const form = el('form', { id: 'contact-form' });
        const name = el('input', { name: 'name', 'aria-label': 'Name' });
        const submit = el('button', { type: 'submit' }, 'Submit contact form');
        form.addEventListener('submit', (event) => {
          event.preventDefault();
          mark('submitted', name.value);
          parent.postMessage({ type: 'fixture-submitted', name: name.value }, '*');
        });
        form.append(name, submit);
        root.append(form);
      } else {
        root.textContent = 'Unknown local benchmark task.';
      }
    </script>
  </body>
</html>
