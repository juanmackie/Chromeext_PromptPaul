<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gmail compose fixture</title>
  </head>
  <body>
    <main aria-label="Gmail compose">
      <input id="gmail-to" aria-label="To" placeholder="Recipients" autocomplete="off" />
      <input id="gmail-subject" aria-label="Subject" placeholder="Subject" />
      <div id="gmail-body" contenteditable="true" role="textbox" aria-label="Message body">
        Gmail draft
      </div>
      <button id="gmail-save" type="button">Save draft</button>
    </main>
  </body>
</html>
